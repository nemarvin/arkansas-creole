<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>French-Speaking Settlers in Little Rock</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">

  <style>
    .leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,
    .leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,
    .leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
    .leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;outline-offset:1px;background:#ece8e3}
    .leaflet-container .leaflet-overlay-pane svg,.leaflet-container .leaflet-marker-pane img,
    .leaflet-container .leaflet-shadow-pane img,.leaflet-container .leaflet-tile-pane img,
    .leaflet-container img.leaflet-image-layer{max-width:none!important;max-height:none!important}
    .leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}
    .leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}
    .leaflet-popup-pane{z-index:700}.leaflet-control{position:relative;z-index:800;pointer-events:auto}
    .leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
    .leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
    .leaflet-control{float:left;clear:both}.leaflet-right .leaflet-control{float:right}
    .leaflet-top .leaflet-control{margin-top:10px}.leaflet-bottom .leaflet-control{margin-bottom:10px}
    .leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{margin-right:10px}
    .leaflet-control-zoom a,.leaflet-bar a,.leaflet-bar button{
      display:block;width:30px;height:30px;line-height:30px;text-align:center;text-decoration:none;
      background:#fff;color:#252525;border-bottom:1px solid #ccc;cursor:pointer
    }
    .leaflet-bar{box-shadow:0 1px 5px rgba(0,0,0,.25);border-radius:3px;overflow:hidden}
    .leaflet-control-attribution{background:rgba(255,255,255,.84);margin:0;padding:0 5px;color:#555;
      font:10px/1.5 Arial,Helvetica,sans-serif}

    :root{
      --panel-bg:#292929;--panel-card:#303030;--panel-rule:#454545;--panel-text:#ededed;
      --accent:#1fc7cf;--accent-dark:#0f969d;--river:#79a9bf;
    }

    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#202020}

    .shell{display:grid;grid-template-columns:minmax(0,1fr) 365px;width:100%;height:100%;min-height:600px}
    .map-wrap{position:relative;min-width:0;min-height:0;background:#eeeae5}
    #map{position:absolute;inset:0;width:100%;height:100%;background:#eeeae5}

    .leaflet-tile-pane{filter:none;opacity:1}

    .map-title{
      position:absolute;z-index:900;top:12px;left:52px;padding:8px 11px 9px;border-radius:3px;
      background:rgba(255,255,255,.92);box-shadow:0 1px 5px rgba(0,0,0,.18);pointer-events:none
    }
    .map-title strong{display:block;font:600 17px/1.2 Georgia,"Times New Roman",serif;color:#333}
    .map-title span{display:block;margin-top:2px;font-size:11px;color:#666}

    .toolbar{
      position:absolute;z-index:950;left:12px;bottom:18px;display:flex;flex-wrap:wrap;gap:6px;
      max-width:min(760px,calc(100% - 24px));padding:8px;border-radius:5px;
      background:rgba(40,40,40,.92);color:#eee;box-shadow:0 1px 7px rgba(0,0,0,.3)
    }
    .toolbar label,.toolbar button,.toolbar input{font:12px/1.2 Arial,Helvetica,sans-serif}
    .toolbar label{display:flex;align-items:center;gap:4px;white-space:nowrap}
    .toolbar input[type="search"]{width:185px;min-width:120px;padding:6px 8px;border:1px solid #777;border-radius:3px;background:#fff;color:#222}
    .toolbar button{padding:6px 8px;border:1px solid #666;border-radius:3px;background:#404040;color:#fff;cursor:pointer}
    .toolbar button:hover,.toolbar button:focus{background:#555}

    .details{position:relative;z-index:1200;height:100%;overflow-y:auto;background:var(--panel-bg);color:var(--panel-text);border-left:1px solid #1d1d1d}
    .details-header{position:sticky;top:0;z-index:10;min-height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#292929;border-bottom:1px solid #444}
    .details-header strong{font-size:14px;font-weight:600}
    .details-close{border:0;background:transparent;color:#bbb;font-size:23px;cursor:pointer;padding:6px}
    .details-body{padding:16px 16px 24px}
    .details-card{background:var(--panel-card);border:1px solid #363636;padding:14px}
    .type-kicker{margin:0 0 14px;color:#dedede;font-size:13px;font-weight:600}
    .details-title{margin:0;font:400 21px/1.25 Georgia,"Times New Roman",serif;color:#f0f0f0}
    .details-subtitle{margin:7px 0 0;font-size:12px;line-height:1.45;color:#aaa}
    .details-note{margin:17px 0 0;font-size:13px;line-height:1.55;color:#d0d0d0}
    .details-reference{margin:18px 0 0;padding-top:15px;border-top:1px solid var(--panel-rule);font-size:12px;line-height:1.5;color:#c3c3c3}
    .placeholder{font-size:13px;line-height:1.55;color:#bbb}


    .petit-rocher-marker {
      width: 18px;
      height: 18px;
      transform: rotate(45deg);
      background: #8a2f47;
      border: 2px solid #f7d7a1;
      border-radius: 2px;
      box-shadow: 0 0 0 1px rgba(0,0,0,.18);
    }

    .place-label{
      background:rgba(255,255,255,.86);border:0;box-shadow:none;color:#343434;
      font:10px/1.1 Arial,Helvetica,sans-serif;padding:1px 3px;white-space:nowrap;text-shadow:0 1px 0 #fff
    }
    .leaflet-tooltip-top:before{border-top-color:rgba(255,255,255,.86)}

    .search-results{
      display:none;position:absolute;z-index:980;left:12px;bottom:68px;width:300px;max-height:260px;overflow:auto;
      background:#fff;color:#222;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.3)
    }
    .search-results.open{display:block}
    .search-result{display:block;width:100%;padding:8px 10px;border:0;border-bottom:1px solid #ddd;text-align:left;background:#fff;cursor:pointer}
    .search-result:hover{background:#f1f1f1}
    .search-result strong{display:block;font-size:12px}
    .search-result span{display:block;margin-top:2px;font-size:11px;color:#666}

    @media(max-width:850px){
      html,body{overflow:auto}
      .shell{grid-template-columns:1fr;grid-template-rows:minmax(480px,60vh) auto;height:auto;min-height:100%}
      .map-wrap{min-height:480px}
      .details{height:auto;border-left:0;border-top:1px solid #1d1d1d}
      .details-header{position:relative}.details-close{display:none}.toolbar{bottom:10px}
    }
  </style>
</head>

<body>
  <div class="shell">
    <div class="map-wrap">
      <div id="map" aria-label="Interactive map of early French-speaking settlers in the Little Rock region"></div>

      <div class="map-title">
        <strong>French-Speaking Settlers in Little Rock</strong>
        <span>Homesteads, claims, and landmarks before and during the early U.S. territorial period</span>
      </div>

      <div id="searchResults" class="search-results"></div>

      <div class="toolbar">
        <input id="searchBox" type="search" placeholder="Search people or claims…" aria-label="Search people or claims">
        <label><input type="checkbox" class="typeFilter" value="Homestead" checked> Homesteads</label>
        <label><input type="checkbox" class="typeFilter" value="Claim" checked> Claims</label>
        <label><input type="checkbox" class="typeFilter" value="Mill" checked> Mill</label>
        <label><input type="checkbox" class="typeFilter" value="Landmark" checked> Landmark</label>
        <label><input id="labelToggle" type="checkbox" checked> Labels</label>
        <button id="resetBtn" type="button">Reset</button>
      </div>
    </div>

    <aside class="details" aria-live="polite">
      <div class="details-header">
        <strong>Details</strong>
        <button id="detailsClose" class="details-close" type="button" aria-label="Clear selection">×</button>
      </div>
      <div class="details-body">
        <div class="details-card" id="detailsContent">
          <div class="placeholder">
            Select a point to explore an early homestead, land claim, mill, or landmark in the Little Rock region.
          </div>
        </div>
      </div>
    </aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map=L.map("map",{scrollWheelZoom:false,zoomControl:true,zoomSnap:.25});

    L.tileLayer(
      "https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}",
      {
        maxZoom:20,
        attribution:
          'Imagery courtesy of the <a href="https://www.usgs.gov/programs/national-geospatial-program/national-map" target="_blank" rel="noopener">U.S. Geological Survey, The National Map</a>'
      }
    ).addTo(map);

    const details=document.getElementById("detailsContent");
    const searchBox=document.getElementById("searchBox");
    const searchResults=document.getElementById("searchResults");
    const labelToggle=document.getElementById("labelToggle");

    let allData=null,pointLayer=null,selectedMarker=null;

    function esc(v){
      if(v===null||v===undefined)return"";
      return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
        .replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }

    function isPetitRocher(feature){
      const p = feature.properties || {};
      const a = String(p.Note_Short || "").toLowerCase();
      const b = String(p.Homestead || "").toLowerCase();
      return a.includes("petit rocher") || b.includes("petit rocher");
    }

    function styleFor(feature){
      const type=feature.properties?.Type||"";
      let radius=6;
      if(type==="Landmark")radius=7;
      if(type==="Mill")radius=6.5;
      return{radius,weight:1.3,color:"#0d9197",fillColor:"#1fc7cf",fillOpacity:.95};
    }

    function showDetails(feature,marker){
      if(selectedMarker){
        if (selectedMarker.setStyle) {
          selectedMarker.setStyle(styleFor(selectedMarker.feature));
        } else if (selectedMarker._icon && isPetitRocher(selectedMarker.feature)) {
          const el = selectedMarker._icon.querySelector(".petit-rocher-marker");
          if (el) {
            el.style.background = "#8a2f47";
            el.style.borderColor = "#f7d7a1";
            el.style.width = "18px";
            el.style.height = "18px";
          }
        }
      }
      selectedMarker=marker;
      if (marker.setStyle) {
        marker.setStyle({...styleFor(feature),radius:9,weight:2.5,color:"#0a7e83",fillColor:"#31dce3"});
      } else if (marker._icon && isPetitRocher(feature)) {
        const el = marker._icon.querySelector(".petit-rocher-marker");
        if (el) {
          el.style.background = "#b13e5a";
          el.style.borderColor = "#ffe5b5";
          el.style.width = "22px";
          el.style.height = "22px";
        }
      }

      const p=feature.properties||{};
      const title=esc(p.Note_Short||p.Homestead||"Unnamed site");
      const homestead=esc(p.Homestead||"");
      const type=esc(p.Type||"Site");
      const note=esc(p.Note_Long||"");
      const source=esc(p.Sources||"");

      details.innerHTML=`
        <p class="type-kicker">${type}</p>
        <h2 class="details-title">${title}</h2>
        ${homestead&&homestead!==title?`<p class="details-subtitle">Claim or homestead: ${homestead}</p>`:""}
        ${note?`<p class="details-note">${note}</p>`:""}
        ${source?`<div class="details-reference"><strong>Source:</strong> ${source}</div>`:""}
      `;
    }

    function clearDetails(){
      if(selectedMarker){selectedMarker.setStyle(styleFor(selectedMarker.feature));selectedMarker=null}
      details.innerHTML=`<div class="placeholder">
        Select a point to explore an early homestead, land claim, mill, or landmark in the Little Rock region.
      </div>`;
    }

    function activeTypes(){
      return new Set([...document.querySelectorAll(".typeFilter:checked")].map(el=>el.value));
    }

    function renderPoints(){
      if(!allData)return;
      if(pointLayer)map.removeLayer(pointLayer);

      const allowed=activeTypes();
      const filtered={type:"FeatureCollection",features:allData.features.filter(f=>allowed.has(f.properties?.Type))};

      pointLayer=L.geoJSON(filtered,{
        pointToLayer:(feature,latlng)=>{
          let marker;
          if (isPetitRocher(feature)) {
            marker = L.marker(latlng, {
              icon: L.divIcon({
                className: "",
                html: '<div class="petit-rocher-marker" aria-hidden="true"></div>',
                iconSize: [18, 18],
                iconAnchor: [9, 9]
              })
            });
          } else {
            marker = L.circleMarker(latlng,styleFor(feature));
          }
          marker.feature=feature;
          return marker;
        },
        onEachFeature:(feature,marker)=>{
          marker.on("click",()=>showDetails(feature,marker));
          marker.bindTooltip(
            esc(feature.properties?.Homestead || feature.properties?.Note_Short || ""),
            {
              permanent:labelToggle.checked,
              direction:"top",
              offset:[0,-6],
              className:"place-label",
              opacity:.92
            }
          );
        }
      }).addTo(map);

      pointLayer.bringToFront();
    }

    function doSearch(q){
      q=q.trim().toLowerCase();
      if(!q||!allData){
        searchResults.classList.remove("open");searchResults.innerHTML="";return;
      }

      const matches=allData.features.filter(f=>{
        const p=f.properties||{};
        return String(p.Note_Short||"").toLowerCase().includes(q)||
               String(p.Homestead||"").toLowerCase().includes(q);
      }).slice(0,12);

      searchResults.innerHTML=matches.length?matches.map((f,i)=>{
        const p=f.properties||{};
        return `<button class="search-result" data-i="${i}">
          <strong>${esc(p.Note_Short||p.Homestead||"Site")}</strong>
          <span>${esc(p.Type||"")}${p.Homestead?` · ${esc(p.Homestead)}`:""}</span>
        </button>`;
      }).join(""):`<div style="padding:10px;font-size:12px">No matches.</div>`;

      searchResults.classList.add("open");

      [...searchResults.querySelectorAll(".search-result")].forEach(btn=>{
        btn.addEventListener("click",()=>{
          const f=matches[Number(btn.dataset.i)];
          const c=f.geometry.coordinates;
          map.setView([c[1],c[0]],14);

          let found=null;
          pointLayer.eachLayer(layer=>{
            if(layer.feature?.properties?.Note_Short===f.properties?.Note_Short &&
               layer.feature?.properties?.Homestead===f.properties?.Homestead)found=layer;
          });
          if(found)showDetails(f,found);
          searchResults.classList.remove("open");
        });
      });
    }

    fetch("../data/little-rock-streams.geojson",{cache:"no-store"})
      .then(r=>{if(!r.ok)throw new Error(`Streams: ${r.status}`);return r.json()})
      .then(data=>{
        const streams=L.geoJSON(data,{
          style:{color:"#75b7da",weight:1.35,opacity:.78,lineCap:"round",lineJoin:"round",interactive:false}
        }).addTo(map);
        streams.bringToFront();
      })
      .catch(err=>console.warn("Local streams could not be loaded:",err));

    fetch("../data/little-rock-creole-settlers.geojson",{cache:"no-store"})
      .then(r=>{if(!r.ok)throw new Error(`Settlers: ${r.status}`);return r.json()})
      .then(data=>{
        allData=data;
        renderPoints();

        // Fixed opening view matching the approved Little Rock framing.
        map.setView([34.748,-92.235],13.5);

        setTimeout(()=>{if(pointLayer)pointLayer.bringToFront();map.invalidateSize()},250);
      })
      .catch(err=>{
        details.innerHTML=`<div class="placeholder">
          The Little Rock settler data could not be loaded. Check that
          <code>docs/data/little-rock-creole-settlers.geojson</code> exists.
        </div>`;
        console.error(err);
      });

    document.querySelectorAll(".typeFilter").forEach(el=>el.addEventListener("change",renderPoints));
    labelToggle.addEventListener("change",renderPoints);
    searchBox.addEventListener("input",()=>doSearch(searchBox.value));
    document.getElementById("detailsClose").addEventListener("click",clearDetails);

    document.getElementById("resetBtn").addEventListener("click",()=>{
      map.setView([34.748,-92.235],13.5);
      clearDetails();
      searchBox.value="";
      searchResults.classList.remove("open");
    });

    map.on("click",()=>searchResults.classList.remove("open"));
  </script>
</body>
</html>
